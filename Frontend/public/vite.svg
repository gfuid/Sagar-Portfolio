<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sagarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#ff3b30" stroke-width="2.5" stroke-opacity="0.9"/>
  
  <!-- Stylized Monogram S -->
  <path d="M43 18 H25 C20 18 16 21.5 16 26 C16 30 19.5 32.5 24 33 H40 C44.5 33.5 48 36.5 48 41 C48 45.5 44 49 39 49 H20" 
        stroke="url(#sagarGrad)" 
        stroke-width="7.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Accent Tech Dots -->
  <circle cx="44" cy="22" r="2.5" fill="#ff6b00" />
  <circle cx="20" cy="45" r="2.5" fill="#ff3b30" />
</svg>
